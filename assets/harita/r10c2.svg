<svg xmlns="http://www.w3.org/2000/svg" width="500" height="64" viewBox="0 0 500 64" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><style>.e{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:d .5s ease-out forwards}.n{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}.p{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.4s ease-out infinite}.br{animation:br 2.4s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:0}}@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.15,1.45)}}@keyframes br{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}</style><path class="e" pathLength="1" d="M16,0 V64" stroke="#fbbf24" style="animation-delay:0.90s"/><path id="s" class="e" pathLength="1" d="M16,18 Q16,32 30,32 H34" stroke="#fbbf24" style="animation-delay:1.05s"/><circle r="3" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="2.95s" repeatCount="indefinite"/><animateMotion dur="1.4s" begin="2.95s" repeatCount="indefinite"><mpath href="#s"/></animateMotion></circle><g class="n" style="animation-delay:1.15s"><rect class="br" x="34" y="13" width="286" height="38" rx="19" fill="#111827" stroke="#34d399" stroke-width="2" style="animation-delay:0.06s"/><text x="52" y="38" font-size="16" font-weight="600" fill="#f1f5f9">🔋 Güç Dağıtımı ve Devre</text><text x="300" y="38" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">↗</text></g></svg>