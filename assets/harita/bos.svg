<svg xmlns="http://www.w3.org/2000/svg" width="500" height="56" viewBox="0 0 500 56" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><defs><filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".35"/></filter></defs><style>.e{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:d .45s ease-out forwards}.f{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 14;opacity:0;animation:fl 1.2s linear infinite,fi .4s ease forwards}.n{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}.p{transform-box:fill-box;transform-origin:center;opacity:0;animation:pu 2.6s ease-out infinite}.dot{animation:bl 2s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:0}}@keyframes fl{to{stroke-dashoffset:-32}}@keyframes fi{to{opacity:.55}}@keyframes pop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.12,1.6)}}@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}</style></svg>