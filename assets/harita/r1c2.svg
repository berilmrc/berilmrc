<svg xmlns="http://www.w3.org/2000/svg" width="250" height="64" viewBox="0 0 250 64" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><style>.e{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:d .5s ease-out forwards}.n{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}.p{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.4s ease-out infinite}.br{animation:br 2.4s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:0}}@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.15,1.45)}}@keyframes br{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}</style><path class="e" pathLength="1" d="M16,0 V64" stroke="#22d3ee" style="animation-delay:0.90s"/></svg>