<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<defs>
<radialGradient id="bg" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#131a2e"/><stop offset="1" stop-color="#0b0f1a"/></radialGradient>
<radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#7c3aed"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.edge{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.node{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
</style>
