<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<defs><filter id="g" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite;animation-delay:0.0s}
.arrow{animation:nudge 1.6s ease-in-out infinite;animation-delay:0.0s}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.12,1.5)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
</style>
<rect width="240" height="64" rx="14" fill="#0f1424"/>
<rect class="ring" x="20" y="12" width="200" height="40" rx="20" fill="none" stroke="#22d3ee" stroke-width="2"/>
<rect x="20" y="12" width="200" height="40" rx="20" fill="#22d3ee" filter="url(#g)"/>
<text x="112.0" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0f1a">STM32</text>
<g class="arrow"><text x="194" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0f1a">→</text></g>
</svg>